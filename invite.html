<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교환일기 초대장</title>
<link rel="icon" href="icon.png">
<!-- 카톡·문자·인스타가 링크를 이미지 카드로 그릴 때 읽는 태그. 주소 뒤 ?code=초대코드&room=방이름 은 아래 스크립트가 읽음. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="교환일기">
<meta property="og:title" content="교환일기 초대장 📔">
<meta property="og:description" content="친구가 같이 일기 쓰자고 초대했어요. 눌러서 일기방에 들어가요!">
<meta property="og:image" content="https://cwlee0911.github.io/exchange-diary-support/invite-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://cwlee0911.github.io/exchange-diary-support/invite.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="교환일기 초대장 📔">
<meta name="twitter:description" content="친구가 같이 일기 쓰자고 초대했어요. 눌러서 일기방에 들어가요!">
<meta name="twitter:image" content="https://cwlee0911.github.io/exchange-diary-support/invite-card.png">
<style>
  :root { --ink: #171717; --muted: #6f665c; --accent: #0042a6; --bg: #fbf6ed; --card: #ffffff; --line: #ece4d7; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 48px 20px 64px; text-align: center; }
  .icon { width: 108px; height: 108px; border-radius: 26px; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
  .eyebrow { margin: 22px 0 6px; color: var(--accent); font-weight: 700; letter-spacing: .02em; }
  h1 { font-size: 24px; line-height: 1.35; margin: 0 0 22px; word-break: keep-all; }
  .code-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px 18px; margin: 0 0 18px; }
  .code-card .label { margin: 0 0 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .code { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: .14em; font-variant-numeric: tabular-nums; user-select: all; }
  .hint { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
  .btn { display: block; width: 100%; padding: 15px 18px; border-radius: 16px; font-weight: 700; font-size: 17px; text-decoration: none; margin: 10px 0; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.secondary { background: var(--card); color: var(--accent); border: 1.5px solid rgba(0,66,166,.25); }
  .small { font-size: 13px; color: var(--muted); margin: 22px 0 0; line-height: 1.6; word-break: keep-all; }
  footer { margin-top: 40px; font-size: 12px; color: var(--muted); }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="교환일기 앱 아이콘">
  <p class="eyebrow">교환일기 초대장</p>
  <h1 id="title">친구가 같이 일기 쓰자고 초대했어요</h1>

  <div class="code-card">
    <p class="label">초대 코드</p>
    <p class="code" id="code">— — —</p>
    <p class="hint" id="copyHint">코드를 누르면 복사돼요</p>
  </div>

  <a class="btn primary" id="open" href="#">앱에서 열기</a>
  <a class="btn secondary" href="https://apps.apple.com/app/id6831194222">App Store에서 교환일기 받기</a>

  <p class="small">앱을 새로 받았다면 Apple로 로그인한 뒤 이 페이지로 돌아와 <strong>앱에서 열기</strong>를 다시 누르거나, 앱에서 화면 위 방 이름 → <strong>새 일기방 / 참여하기</strong> → <strong>코드로 참여하기</strong>에 위 코드를 넣어요.</p>
  <p class="small">아이폰·아이패드 전용이에요.</p>

  <footer><a href="index.html">교환일기 지원</a> · <a href="privacy.html">개인정보 처리방침</a></footer>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const code = (params.get('code') || '').toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 12);
  const room = (params.get('room') || '').trim();
  const codeEl = document.getElementById('code');
  if (code) codeEl.textContent = code;
  if (room) document.getElementById('title').textContent = `'${room}' 일기방에 초대됐어요`;

  // 앱으로 열기 — 앱이 없으면 아무 일도 안 일어나서 1.5초 뒤 App Store로.
  const open = document.getElementById('open');
  open.href = `exchangediary://join?code=${code}`;
  open.addEventListener('click', () => {
    setTimeout(() => { if (!document.hidden) location.href = 'https://apps.apple.com/app/id6831194222'; }, 1500);
  });

  codeEl.addEventListener('click', async () => {
    if (!code || !navigator.clipboard) return;
    try { await navigator.clipboard.writeText(code); document.getElementById('copyHint').textContent = '복사했어요 ✓'; } catch (e) {}
  });
</script>
</body>
</html>
