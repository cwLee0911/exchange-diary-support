<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>악어일기 초대장</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<!-- 카톡·문자·인스타가 링크를 이미지 카드로 그릴 때 읽는 태그. 주소 뒤 ?code=초대코드&room=방이름 은 아래 스크립트가 읽음.
     카드 그림 파일 이름을 바꾸면(invite-card-v3) 카톡이 예전 그림을 캐시에서 다시 쓰지 않음. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="악어일기">
<meta property="og:title" content="악어일기 초대장 💌">
<meta property="og:description" content="같이 일기 쓰자고 초대가 왔어요. 눌러서 일기방에 들어가요!">
<meta property="og:image" content="https://cwlee0911.github.io/exchange-diary-support/invite-card-v3.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://cwlee0911.github.io/exchange-diary-support/invite.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="악어일기 초대장 💌">
<meta name="twitter:description" content="같이 일기 쓰자고 초대가 왔어요. 눌러서 일기방에 들어가요!">
<meta name="twitter:image" content="https://cwlee0911.github.io/exchange-diary-support/invite-card-v3.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  :root { --ink: #111112; --muted: #6f665c; --cream: #FCF3E7; --paper: #FFFCF6; --sage: #A9C283;
          --sage-deep: #5F7A3E; --butter: #F6D66B; --blush: #F4B6A8; --line: rgba(17,17,18,.07); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .jua { font-family: "Jua", "Apple SD Gothic Neo", sans-serif; font-weight: 400; }
  .pen { font-family: "Nanum Pen Script", cursive; }
  .sticker-icon { width: 112px; height: 112px; border-radius: 27px; display: block;
                  box-shadow: 0 0 0 7px #fff, 0 12px 22px 2px rgba(156,143,122,.45); }
  .btn { display: block; width: 100%; padding: 14px 18px; border-radius: 999px; font-weight: 700; font-size: 17px;
         text-decoration: none; margin: 12px 0; border: 3px solid var(--ink); color: var(--ink); text-align: center; }
  .btn.primary { background: var(--sage); }
  .btn.secondary { background: #fff; }
  .small { font-size: 13px; color: var(--muted); margin: 20px 0 0; line-height: 1.6; word-break: keep-all; }
  footer { margin-top: 36px; font-size: 12px; color: var(--muted); }
  footer a { color: var(--muted); }
  .code { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: .12em; font-variant-numeric: tabular-nums;
          user-select: all; cursor: pointer; word-break: break-all; }
  .hint { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  .hl { background: linear-gradient(transparent 58%, rgba(169,194,131,.75) 58%, rgba(169,194,131,.75) 92%, transparent 92%);
        padding: 0 2px; }

  body { background-color: var(--cream);
         background-image: radial-gradient(circle, rgba(169,194,131,.55) 3px, transparent 3.5px),
                           radial-gradient(circle, rgba(246,214,107,.6) 2.5px, transparent 3px);
         background-size: 46px 46px, 62px 62px; background-position: 0 0, 23px 31px; }
  main { max-width: 420px; margin: 0 auto; padding: 40px 22px 56px; text-align: center; }
  .ticket { position: relative; background: var(--paper); border: 3px solid var(--ink); border-radius: 26px;
            box-shadow: 0 10px 20px rgba(156,143,122,.35); margin: 8px 0 18px; }
  .ticket .top { padding: 26px 22px 20px; }
  .ticket .stub { padding: 16px 22px 20px; background: var(--sage); border-radius: 0 0 23px 23px; }
  .perf { position: relative; height: 0; border-top: 3px dashed var(--ink); margin: 0 22px; }
  .perf::before, .perf::after { content: ""; position: absolute; top: -17px; width: 30px; height: 30px; border-radius: 50%;
            background: var(--cream); border: 3px solid var(--ink); }
  .perf::before { left: -41px; clip-path: inset(0 0 0 50%); }
  .perf::after { right: -41px; clip-path: inset(0 50% 0 0); }
  .ticket .sticker-icon { margin: 0 auto; transform: rotate(-4deg); width: 96px; height: 96px; border-radius: 23px; }
  .eyebrow { margin: 18px 0 2px; font-size: 18px; color: var(--sage-deep); }
  h1 { font-size: 28px; line-height: 1.3; margin: 0; word-break: keep-all; }
  .stub .label { margin: 0 0 2px; font-size: 17px; }
  .doodle { position: absolute; }
</style>
</head>
<body>
<main>
  <div class="ticket">
    <svg viewBox="0 0 64 64" width="40" height="40" class="doodle" style="left:-16px;top:-18px;transform:rotate(-12deg)"><path d="M32 7l7.6 15.5 17 2.5-12.3 12 2.9 17L32 46l-15.2 8 2.9-17-12.3-12 17-2.5z" fill="#F6D66B" stroke="#fff" stroke-width="12" stroke-linejoin="round"/><path d="M32 7l7.6 15.5 17 2.5-12.3 12 2.9 17L32 46l-15.2 8 2.9-17-12.3-12 17-2.5z" fill="#F6D66B" stroke="#111112" stroke-width="4.5" stroke-linejoin="round"/></svg><svg viewBox="0 0 64 64" width="38" height="38" class="doodle" style="right:-14px;top:70px;transform:rotate(10deg)"><path d="M32 54C14 41 8 32 8 23a12 12 0 0 1 24-4 12 12 0 0 1 24 4c0 9-6 18-24 31z" fill="#F4B6A8" stroke="#fff" stroke-width="12" stroke-linejoin="round"/><path d="M32 54C14 41 8 32 8 23a12 12 0 0 1 24-4 12 12 0 0 1 24 4c0 9-6 18-24 31z" fill="#F4B6A8" stroke="#111112" stroke-width="4.5" stroke-linejoin="round"/></svg>
    <div class="top">
      <img class="sticker-icon" src="icon.png" alt="악어일기 앱 아이콘">
      <p class="eyebrow jua">악어일기 초대장</p>
      <h1 class="jua" id="title">같이 일기 쓰자고 초대가 왔어요</h1>
    </div>
    <div class="perf"></div>
    <div class="stub">
      <p class="label jua">입장 코드</p>
      <p class="code" id="code">— — —</p>
      <p class="hint" id="copyHint" style="color:#2f3a22">코드를 누르면 복사돼요</p>
    </div>
  </div>

  <a class="btn primary" id="open" href="#">앱에서 열기</a>
  <a class="btn secondary" href="https://apps.apple.com/app/id6831194222">App Store에서 악어일기 받기</a>

  <p class="small">앱을 새로 받았다면 로그인한 뒤 이 페이지로 돌아와 <strong>앱에서 열기</strong>를 다시 누르거나, 앱에서 화면 위 방 이름 → <strong>새 일기방 / 참여하기</strong> → <strong>코드로 참여하기</strong>에 위 코드를 넣어요.</p>
  <p class="small">아이폰·아이패드 전용이에요.</p>

  <footer><a href="index.html">악어일기 지원</a> · <a href="privacy.html">개인정보 처리방침</a></footer>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const code = (params.get('code') || '').toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 12);
  const room = (params.get('room') || '').trim();
  const codeEl = document.getElementById('code');
  if (code) codeEl.textContent = code;
  if (room) document.getElementById('title').textContent = `'${room}' 일기방에 초대됐어요`;

  // 앱으로 열기 — 앱이 없으면 아무 일도 안 일어나서 1.5초 뒤 App Store로.
  const open = document.getElementById('open');
  open.href = `exchangediary://join?code=${code}`;
  open.addEventListener('click', () => {
    setTimeout(() => { if (!document.hidden) location.href = 'https://apps.apple.com/app/id6831194222'; }, 1500);
  });

  codeEl.addEventListener('click', async () => {
    if (!code || !navigator.clipboard) return;
    try { await navigator.clipboard.writeText(code); document.getElementById('copyHint').textContent = '복사했어요 ✓'; } catch (e) {}
  });
</script>
</body>
</html>
